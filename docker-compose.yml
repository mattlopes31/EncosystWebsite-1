services:
  encosyst-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: encosyst-website
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SMTP_SERVICE=${SMTP_SERVICE:-gmail}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
    restart: unless-stopped
    env_file:
      - .env.local