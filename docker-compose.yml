services:
  encosyst-website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: encosyst-website
    image: encosyst-website:local
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    restart: unless-stopped
    env_file:
      - .env.local
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
